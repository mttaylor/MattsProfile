<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="760" viewBox="0 0 1600 760" role="img" aria-labelledby="title desc">
  <title id="title">Environment version dashboard example</title>
  <desc id="desc">Dark themed dashboard with environment metrics and filter controls.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#041223"/>
      <stop offset="100%" stop-color="#020a16"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="760" fill="url(#bg)"/>

  <g font-family="Segoe UI, Arial, sans-serif">
    <rect x="48" y="32" width="502" height="166" rx="14" fill="#121b2a" stroke="#2b3b53"/>
    <rect x="568" y="32" width="502" height="166" rx="14" fill="#121b2a" stroke="#2b3b53"/>
    <rect x="1088" y="32" width="464" height="166" rx="14" fill="#121b2a" stroke="#2b3b53"/>

    <text x="80" y="78" fill="#7f90a7" font-size="20" font-weight="700" letter-spacing="1">TOTAL ENVIRONMENTS</text>
    <text x="80" y="128" fill="#e7edf5" font-size="62" font-weight="700">773</text>

    <text x="600" y="78" fill="#7f90a7" font-size="20" font-weight="700" letter-spacing="1">CLOUD PROVIDERS</text>
    <text x="600" y="128" fill="#e7edf5" font-size="62" font-weight="700">3</text>
    <text x="600" y="168" fill="#8da0b8" font-size="36" opacity="0.95">AWS: 601, AZURE: 159, GCP: 13</text>

    <text x="1120" y="78" fill="#7f90a7" font-size="20" font-weight="700" letter-spacing="1">ENV LEVELS</text>
    <text x="1120" y="128" fill="#e7edf5" font-size="62" font-weight="700">3</text>
    <text x="1120" y="168" fill="#8da0b8" font-size="36" opacity="0.95">uat: 319, staging: 250, production: 204</text>

    <rect x="48" y="220" width="502" height="166" rx="14" fill="#121b2a" stroke="#2b3b53"/>
    <rect x="568" y="220" width="502" height="166" rx="14" fill="#121b2a" stroke="#2b3b53"/>

    <text x="80" y="266" fill="#7f90a7" font-size="20" font-weight="700" letter-spacing="1">COHORTS</text>
    <text x="80" y="316" fill="#e7edf5" font-size="62" font-weight="700">4</text>
    <text x="80" y="356" fill="#8da0b8" font-size="36" opacity="0.95">GA: 650, Exception: 101, Internal: 20, Unknown: 2</text>

    <text x="600" y="266" fill="#7f90a7" font-size="20" font-weight="700" letter-spacing="1">PLATFORM VERSIONS</text>
    <text x="600" y="316" fill="#e7edf5" font-size="62" font-weight="700">20</text>

    <rect x="48" y="430" width="180" height="52" rx="10" fill="#252f3e" stroke="#3b4a60"/>
    <rect x="246" y="430" width="180" height="52" rx="10" fill="#252f3e" stroke="#3b4a60"/>
    <rect x="444" y="430" width="140" height="52" rx="10" fill="#252f3e" stroke="#3b4a60"/>
    <rect x="602" y="430" width="170" height="52" rx="10" fill="#252f3e" stroke="#3b4a60"/>
    <rect x="790" y="430" width="130" height="52" rx="10" fill="#252f3e" stroke="#3b4a60"/>
    <rect x="938" y="430" width="120" height="52" rx="10" fill="#252f3e" stroke="#3b4a60"/>

    <text x="72" y="463" fill="#d0d8e6" font-size="20">Platform Version</text>
    <text x="270" y="463" fill="#d0d8e6" font-size="20">Release Group</text>
    <text x="468" y="463" fill="#d0d8e6" font-size="20">Opportunity</text>
    <text x="626" y="463" fill="#d0d8e6" font-size="20">Cloud Provider</text>
    <text x="820" y="463" fill="#d0d8e6" font-size="20">Env Level</text>
    <text x="964" y="463" fill="#d0d8e6" font-size="20">Cohort</text>

    <rect x="48" y="510" width="162" height="50" rx="10" fill="#202936" stroke="#3b4a60"/>
    <rect x="228" y="510" width="884" height="50" rx="10" fill="#040d1b" stroke="#2c3e57"/>
    <rect x="1130" y="506" width="124" height="58" rx="10" fill="#1c9840"/>
    <rect x="1268" y="506" width="122" height="58" rx="10" fill="#252f3e" stroke="#3b4a60"/>
    <rect x="1404" y="506" width="148" height="58" rx="10" fill="#252f3e" stroke="#3b4a60"/>

    <text x="70" y="542" fill="#c9d2e1" font-size="22">Mongo Size</text>
    <text x="248" y="542" fill="#52647f" font-size="22">Search...</text>
    <text x="1155" y="542" fill="#e9f8ed" font-size="22">Select All</text>
    <text x="1292" y="542" fill="#d0d8e6" font-size="22">Clear All</text>
    <text x="1430" y="542" fill="#d0d8e6" font-size="22">Export CSV</text>
  </g>
</svg>
